<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>¡Feliz Cumpleaños Melvin!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-1: #3a1a52;
      --purple-2: #241033;
      --purple-3: #150a20;
      --ink: #3a2b1c;
      --gold: #d4a017;
      --wine: #7a2333;
      --cream: #f3e6c9;
      --gap: 2.5%;
      --page-w: min(96vw, 160vh, 1200px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(ellipse at 20% 15%, rgba(150,90,200,0.20), transparent 45%),
        radial-gradient(ellipse at 85% 85%, rgba(0,0,0,0.35), transparent 50%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 3px),
        linear-gradient(160deg, var(--purple-1), var(--purple-2) 55%, var(--purple-3));
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 0 20px;
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      position: relative;
    }

    .backbtn {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--cream);
      border: 2px solid var(--ink);
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.25);
      transition: all 0.2s ease;
      z-index: 100;
      display: none;
    }

    .canvas {
      position: relative;
      width: var(--page-w);
      aspect-ratio: 2.0513 / 1;
      perspective: 1800px;
    }

    .diptych {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: var(--gap);
      align-items: center;
    }

    .page {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--cream);
      border: 1px solid rgba(0,0,0,0.15);
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    #envPage {
      border-radius: 5px 2px 2px 5px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35), inset -8px 0 14px -10px rgba(0,0,0,0.55);
      cursor: pointer;
    }

    #cakePage {
      border-radius: 2px 5px 5px 2px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35), inset 8px 0 14px -10px rgba(0,0,0,0.55);
    }

    /* COVER / PORTADA */
    .cover-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      transition: opacity 480ms ease 300ms;
    }

    .canvas.open .cover-layer {
      pointer-events: none;
      opacity: 0;
    }

    .cover-card {
      position: relative;
      width: calc((100% - var(--gap)) / 2);
      aspect-ratio: 1 / 1;
      border-radius: 5px 2px 2px 5px;
      background-image: url('1%20p.png');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 46px rgba(0,0,0,0.55);
      transform: rotateY(0deg);
      transform-origin: left center;
      transition: transform 750ms cubic-bezier(.5,.02,.4,1);
    }

    .canvas.open .cover-card {
      transform: rotateY(-165deg);
    }

    /* ===== PARTE 1: SOBRE Y CARTA (IMAGEN 3) ===== */
    .env-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .env-wrap img.env-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 400ms ease;
    }

    .letter-card {
      position: absolute;
      left: 50%;
      top: 22%;
      width: 58%;
      transform: translate(-50%, -10%) scale(0.16) rotate(-6deg);
      opacity: 0;
      z-index: 2;
      transition: left 620ms cubic-bezier(.2,.8,.2,1.15), top 620ms cubic-bezier(.2,.8,.2,1.15), transform 620ms cubic-bezier(.2,.8,.2,1.15), opacity 420ms ease;
      pointer-events: none;
    }

    .letter-card img {
      display: block;
      width: 100%;
      border-radius: 3px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.35);
    }

    #envPage.open .letter-card {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1) rotate(-1.2deg);
      opacity: 1;
      pointer-events: auto;
    }

    #envPage.open .env-bg {
      opacity: 0.2;
    }

    .tap-label {
      position: absolute;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Caveat', cursive;
      font-size: 1.05rem;
      color: var(--ink);
      background: rgba(255,255,255,0.55);
      padding: 2px 12px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 300ms ease;
    }

    #envPage.open .tap-label {
      opacity: 0;
    }

    /* ===== PARTE 2: TORTA Y VELAS (IMAGEN 4) ===== */
    .cake-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .cake-wrap img.cake-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .flame {
      position: absolute;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffff00 35%, #ff3d00 80%, transparent 100%);
      border-radius: 50% 50% 20% 20%;
      filter: drop-shadow(0 0 8px #ffeb3b);
      transform-origin: 50% 100%;
      animation: flicker 1.6s ease-in-out infinite;
      transition: opacity 160ms linear;
    }

    .flame.f1 {
      left: 41.13%;
      top: 16.05%;
      width: 8.6%;
      height: 10.45%;
      animation-delay: 0s;
    }

    .flame.f2 {
      left: 55.83%;
      top: 18.5%;
      width: 6.35%;
      height: 9.5%;
      animation-delay: 0.35s;
    }

    @keyframes flicker {
      0%, 100% { transform: rotate(-2.5deg) scaleY(1); }
      25% { transform: rotate(2deg) scaleY(0.97); }
      50% { transform: rotate(-1deg) scaleY(1.03); }
      75% { transform: rotate(3deg) scaleY(0.98); }
    }

    .flame.blowing {
      animation: none !important;
      transform: rotate(30deg) skewX(20deg) scaleY(0.7) !important;
    }

    .flame.out {
      opacity: 0 !important;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    /* CONTROLES DEL MICRÓFONO */
    .mic-ui {
      position: absolute;
      left: 50%;
      bottom: 2%;
      transform: translateX(-50%);
      width: 92%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 6;
      background: rgba(20,10,15,0.4);
      border-radius: 12px;
      padding: 6px 8px 7px;
    }

    .mic-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.58rem;
      color: var(--cream);
      opacity: 0.95;
      white-space: nowrap;
    }

    .meter {
      width: 54px;
      height: 6px;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7fc97f, #f6c453, #e0553b);
      transition: width 60ms linear;
    }

    .hold-btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.62rem;
      color: #fff;
      background: linear-gradient(180deg, var(--wine), #5c1a26);
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #3f0f18;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    .hold-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3f0f18;
    }

    /* VENTANA DEL DESEO */
    .wish-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(243,230,201,0.95);
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease;
      z-index: 9;
      text-align: center;
      padding: 10%;
    }

    .wish-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .wish-overlay h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      color: var(--wine);
    }

    .relight-btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.75rem;
      color: var(--ink);
      background: var(--gold);
      border: 2px solid var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.3);
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <button class="backbtn" id="backBtn" type="button">‹ volver a la portada</button>

  <div class="canvas" id="canvas">

    <!-- COVER LAYER (PORTADA) -->
    <div class="cover-layer" id="coverLayer">
      <div class="cover-card"></div>
    </div>

    <!-- PÁGINAS INTERIORES -->
    <div class="diptych">

      <!-- PÁGINA IZQUIERDA: CARTA (IMAGEN 3) -->
      <div class="page" id="envPage">
        <div class="env-wrap">
          <img class="env-bg" src="2%20sobre.png" alt="Sobre" />
          <div class="letter-card" id="letterCard">
            <img src="3%20car.png" alt="Carta" />
          </div>
          <div class="tap-label">haz clic para ver la carta</div>
        </div>
      </div>

      <!-- PÁGINA DERECHA: TORTA Y VELAS (IMAGEN 4) -->
      <div class="page" id="cakePage">
        <div class="cake-wrap">
          <img class="cake-bg" src="4%20pastel.png" alt="Pastel" />
          <div class="flame f1" id="flame1"></div>
          <div class="flame f2" id="flame2"></div>
        </div>

        <div class="mic-ui">
          <div class="mic-row">
            <span>Sopla al micrófono</span>
            <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
          </div>
          <button class="hold-btn" id="holdBtn" type="button">Sostener para soplar</button>
        </div>

        <div class="wish-overlay" id="wishOverlay">
          <h2>¡Ojalá la hayas pasado excelente! ✨</h2>
          <p>Que se cumplan todos tus deseos y proyectos este año.</p>
          <button class="relight-btn" id="relightBtn" type="button">Volver a encender</button>
        </div>
      </div>

    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const coverLayer = document.getElementById('coverLayer');
    const backBtn = document.getElementById('backBtn');
    const envPage = document.getElementById('envPage');
    const flame1 = document.getElementById('flame1');
    const flame2 = document.getElementById('flame2');
    const meterFill = document.getElementById('meterFill');
    const holdBtn = document.getElementById('holdBtn');
    const wishOverlay = document.getElementById('wishOverlay');
    const relightBtn = document.getElementById('relightBtn');

    let candlesLit = true;
    let blowTimer = null;
    let blowProgress = 0;

    // Abrir libro al tocar portada
    coverLayer.addEventListener('click', () => {
      canvas.classList.add('open');
      backBtn.style.display = 'flex';
      initMic();
    });

    // Volver a la portada
    backBtn.addEventListener('click', () => {
      canvas.classList.remove('open');
      envPage.classList.remove('open');
      backBtn.style.display = 'none';
    });

    // Abrir/cerrar carta
    envPage.addEventListener('click', () => {
      envPage.classList.toggle('open');
    });

    // Control del Micrófono
    async function initMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function checkVolume() {
          if (!candlesLit) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;

          if (average > 30) {
            registerBlowing(true);
          } else if (!isManualBlowing) {
            registerBlowing(false);
          }
          requestAnimationFrame(checkVolume);
        }
        checkVolume();
      } catch (e) {
        console.log("Micrófono no disponible, usar botón manual.");
      }
    }

    let isManualBlowing = false;

    function registerBlowing(isBlowing) {
      if (!candlesLit) return;

      if (isBlowing) {
        flame1.classList.add('blowing');
        flame2.classList.add('blowing');
        blowProgress += 6;
        meterFill.style.width = Math.min(100, blowProgress) + '%';

        if (blowProgress >= 100) {
          extinguishCandles();
        }
      } else {
        flame1.classList.remove('blowing');
        flame2.classList.remove('blowing');
        blowProgress = Math.max(0, blowProgress - 3);
        meterFill.style.width = blowProgress + '%';
      }
    }

    function extinguishCandles() {
      candlesLit = false;
      flame1.classList.remove('blowing');
      flame2.classList.remove('blowing');
      flame1.classList.add('out');
      flame2.classList.add('out');
      meterFill.style.width = '100%';

      setTimeout(() => {
        wishOverlay.classList.add('show');
        launchConfetti();
      }, 300);
    }

    function startManualBlow() {
      isManualBlowing = true;
      blowTimer = setInterval(() => registerBlowing(true), 50);
    }

    function stopManualBlow() {
      isManualBlowing = false;
      clearInterval(blowTimer);
      registerBlowing(false);
    }

    holdBtn.addEventListener('mousedown', startManualBlow);
    holdBtn.addEventListener('mouseup', stopManualBlow);
    holdBtn.addEventListener('mouseleave', stopManualBlow);
    holdBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startManualBlow(); });
    holdBtn.addEventListener('touchend', stopManualBlow);

    relightBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      candlesLit = true;
      flame1.classList.remove('out');
      flame2.classList.remove('out');
      wishOverlay.classList.remove('show');
      blowProgress = 0;
      meterFill.style.width = '0%';
    });

    function launchConfetti() {
      const canvasCtx = document.getElementById('confetti-canvas');
      const ctx = canvasCtx.getContext('2d');
      canvasCtx.width = window.innerWidth;
      canvasCtx.height = window.innerHeight;

      const pieces = [];
      const colors = ['#d4a017', '#7a2333', '#f3e6c9', '#a855f7', '#00bcd4', '#ffeb3b'];

      for (let i = 0; i < 100; i++) {
        pieces.push({
          x: Math.random() * canvasCtx.width,
          y: Math.random() * canvasCtx.height - canvasCtx.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 4 + 2,
          rotation: Math.random() * 360
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvasCtx.width, canvasCtx.height);
        pieces.forEach((p) => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();

          p.y += p.speed;
          p.rotation += 2;

          if (p.y > canvasCtx.height) p.y = -10;
        });

        if (!candlesLit) requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
