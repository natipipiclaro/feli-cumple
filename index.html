<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta de Amor</title>
  <style>
    /* Estilos generales de la página */
    body {
      margin: 0;
      padding: 0;
      background-color: #f4e1d2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }

    /* Contenedor principal de la carta/sobre */
    .container {
      position: relative;
      width: 90%;
      max-width: 800px;
      background-color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
    }

    /* Sección de la imagen (izquierda) */
    .env-image-container {
      flex: 1;
      position: relative;
      min-height: 400px;
    }

    .env-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Sección del mensaje (derecha) */
    .letter-content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #fff9f5;
    }

    .letter-content h1 {
      color: #b03a2e;
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .letter-content p {
      color: #4a4a4a;
      line-height: 1.6;
      font-size: 16px;
      text-align: justify;
    }

    /* Responsive para pantallas pequeñas */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }
      .env-image-container {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Imagen del sobre / fondo -->
    <div class="env-image-container">
      <img class="env-bg" src="URL_DE_TU_IMAGEN_AQUI" alt="Carta o Sobre">
    </div>

    <!-- Contenido del texto -->
    <div class="letter-content">
      <h1>Para Alguien Especial</h1>
      <p>
        Escribe aquí el mensaje especial que quieres dedicar. Puedes personalizar este texto con tus propias palabras, recuerdos o buenos deseos.
      </p>
    </div>
  </div>

</body>
</html>
